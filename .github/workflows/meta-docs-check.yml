name: Meta docs drift check

# The tripwire behind SKILL.md section "Staying Current". Fetches the changelog
# of each documentation tree this skill transcribes -- Content Library and API,
# and the Secure Research Environment -- and opens an issue when one grows a
# dated entry the skill has not been reconciled against.
#
# It deliberately does NOT commit an updated baseline. The open issue is the
# signal, and it should survive until a human has actually reconciled the
# affected guides and followed the release checklist in CHANGELOG.md.
#
# KNOWN LIMIT, worth remembering before trusting a green run: this catches
# *announced* changes only. Meta has shipped at least two unannounced ones -- the
# S3 upload page's "not supported for Meta Content Library" sentence, and the
# monthly data-deletion guide -- and neither appeared on either changelog.

on:
  schedule:
    # 09:00 UTC on the 1st of each month. The SRE is unavailable for the whole
    # of the 1st anyway (its own maintenance window), so that day is already
    # lost to querying -- a good one to spend on documentation.
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create docs-drift --color B60205 \
            --description "Meta's documentation changed" --force
          gh label create docs-check-broken --color D93F0B \
            --description "The docs tripwire itself failed" --force

      # The script reports drift and failure INDEPENDENTLY, because with more
      # than one source they are no longer mutually exclusive: a 404 on one page
      # must not swallow real drift on the other. The process exit code still
      # collapses them (2 dominates 1), so gate on the outputs, not on the code.
      - name: Compare Meta's changelogs against the committed baseline
        id: drift
        run: |
          set +e
          python3 .github/scripts/check_meta_docs.py --check --drift-body drift_tables.md
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "checker exit code: $code"

      - name: Count open alerts
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          drift=$(gh issue list --state open --label docs-drift --json number --jq 'length')
          broken=$(gh issue list --state open --label docs-check-broken --json number --jq 'length')
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
          echo "broken=$broken" >> "$GITHUB_OUTPUT"
          echo "open: drift=$drift broken=$broken"

      - name: Open a drift issue
        if: steps.drift.outputs.drift == 'true' && steps.open.outputs.drift == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCES: ${{ steps.drift.outputs.drifted_sources }}
        run: |
          {
            echo "Meta's documentation carries changelog entries this skill has not"
            echo "been reconciled against."
            echo
            cat drift_tables.md
            cat <<'EOF'

          ### What to do

          1. Read **only the guides the new entries name**. Reconciling every page
             is a day's work and is not what this alert is for.
          2. Route each change by the **Owns** line under its table above. Entries on
             the Secure Research Environment changelog are environment facts, and the
             ones about *driving* the SRE belong in the client repo, not this one.
          3. **A documented name never overrides a `[verified DATE]` observation in
             this repo.** Where they conflict, record both and keep the observation
             operative -- see `references/field_reference.md` section "Where the docs
             and this file disagree".
          4. Update the baseline in **two** places: the human-readable one in
             `SKILL.md` section "Staying Current", and the machine one with
             `python3 .github/scripts/check_meta_docs.py --update`
             (add `--only <source>` to refresh just one).
          5. Follow the release checklist at the end of `CHANGELOG.md`.

          Closing this without step 4 means it reopens next month.

          An entry disappearing is usually a reworded page rather than a retraction,
          but it is worth a look -- this parse keys on dates alone.

          <sub>Opened by `.github/workflows/meta-docs-check.yml`. Run it by hand from the Actions tab.</sub>
          EOF
          } > body.md
          gh issue create --label docs-drift \
            --title "Meta docs changed: ${SOURCES}" \
            --body-file body.md

      # A tripwire that breaks and reports "no change" is worse than no tripwire,
      # so a failed check gets its own alert rather than a silent green run. Note
      # this can fire in the same run as the drift issue above -- one source can
      # break while another legitimately drifts.
      - name: Open a check-broken issue
        if: steps.drift.outputs.broken == 'true' && steps.open.outputs.broken == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.drift.outputs.failed_sources }}
          DETAIL: ${{ steps.drift.outputs.failure_detail }}
        run: |
          cat > broken.md <<EOF
          \`.github/scripts/check_meta_docs.py\` could not fetch or parse one or more
          watched changelogs, so **that part of this skill is currently unmonitored**.
          Until it is fixed, treat \`SKILL.md\` section "Staying Current" as the only
          baseline for the affected tree and check it by hand.

          | | |
          |---|---|
          | Failed sources | \`${FAILED}\` |
          | Detail | ${DETAIL} |

          Likely causes, cheapest first:

          - **The request is being rejected.** \`developers.facebook.com\` answers a
            bare request with HTTP 400; it needs browser-shaped headers, including
            \`Sec-Fetch-*\`. Those are in \`HEADERS\` in the script -- Meta may have
            tightened them further.
          - **The page moved.** Check the \`url\` for that source in \`SOURCES\`.
          - **The date format changed**, so \`DATE_RE\` no longer matches -- or the
            entry count fell below that source's \`min_entries\`, which is the guard
            that stops a half-parsed page from reading as "no drift". The floors are
            per-source on purpose: the Content Library changelog carried 19 entries
            and the Researcher Platform one only 5, so a single global floor would
            be wrong for one of them.

          Reproduce locally:

          \`\`\`
          python3 .github/scripts/check_meta_docs.py --check
          python3 .github/scripts/check_meta_docs.py --check --only ${FAILED%% *}
          \`\`\`

          Exit 2 = this failure, 1 = real drift, 0 = clean.
          EOF
          gh issue create --label docs-check-broken \
            --title "Meta docs check is broken -- ${FAILED} is not being watched" \
            --body-file broken.md

      - name: Fail the run if the check itself broke
        if: steps.drift.outputs.broken == 'true'
        run: |
          echo "::error::The Meta docs tripwire could not read ${{ steps.drift.outputs.failed_sources }}. See the docs-check-broken issue."
          exit 1
